# TEMPORARY: removed before merging to main.
# Builds the Android APK on every push to main and publishes it as a GitHub Release.
# The web app (Account_UI) downloads the latest release when it deploys and serves it at
# /downloads/MySuccess.apk. Stable link to the newest APK:
#   https://github.com/successprabu/AIMobileApp/releases/latest/download/MySuccess.apk
#
# Signing: if the repository secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD are set, the APK is signed with that key
# (needed for the Play Store; keep the keystore safe, every update must use it).
# Without them it is signed with Expo's standard debug key, which is fine for direct download.

name: Android test build (branch, not published)

on:
  push:
    branches: [school-app-full]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-test
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ env.VERSION_NAME }}
    env:
      # Same backend as the web app. No secret keys go into the app: anything in an APK can be read.
      # (SMS OTPs are sent by the API; see Auth/SendOtp.)
      EXPO_PUBLIC_API_BASE_URL: https://successapi.azurewebsites.net/api/
      VERSION_CODE: 1
      VERSION_NAME: 0.0.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Type check
        run: npx tsc --noEmit -p .

      - name: Set version
        # Each build gets a higher versionCode so phones accept it as an update.
        run: |
          node -e "
            const fs = require('fs');
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.version = process.env.VERSION_NAME;
            app.expo.android.versionCode = Number(process.env.VERSION_CODE);
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - name: Firebase config for push notifications (when configured)
        # Repository secret GOOGLE_SERVICES_JSON = the whole google-services.json from the Firebase console.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then echo "No Firebase config: the app is built without push notifications."; exit 0; fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))" || { echo "::error::GOOGLE_SERVICES_JSON is not valid JSON"; exit 1; }

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Use the release key (when configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No release key configured: signing with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          cat >> android/gradle.properties <<EOF
          MYAPP_RELEASE_STORE_FILE=release.keystore
          MYAPP_RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD
          MYAPP_RELEASE_KEY_ALIAS=$KEY_ALIAS
          MYAPP_RELEASE_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          node -e "
            const fs = require('fs');
            const p = 'android/app/build.gradle';
            let s = fs.readFileSync(p, 'utf8');
            s = s.replace(/signingConfigs \{/, \`signingConfigs {
                  release {
                      storeFile file(MYAPP_RELEASE_STORE_FILE)
                      storePassword MYAPP_RELEASE_STORE_PASSWORD
                      keyAlias MYAPP_RELEASE_KEY_ALIAS
                      keyPassword MYAPP_RELEASE_KEY_PASSWORD
                  }\`);
            s = s.replace(/(release \{[^}]*?)signingConfig signingConfigs\.debug/s, '\$1signingConfig signingConfigs.release');
            fs.writeFileSync(p, s);
          "

      - name: Build APK
        working-directory: android
        # Smaller download: 64-bit phones only (every Android phone since about 2017), native
        # libraries and the JS bundle compressed inside the APK, and R8 removes unused code/resources.
        run: >
          ./gradlew assembleRelease --no-daemon
          -PreactNativeArchitectures=arm64-v8a
          -Pexpo.useLegacyPackaging=true
          -Pandroid.enableBundleCompression=true
          -Pandroid.enableMinifyInReleaseBuilds=true
          -Pandroid.enableShrinkResourcesInReleaseBuilds=true

      - name: Name the APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/MySuccess.apk
          ls -lh dist

      - name: Build the Play Store bundle (AAB, only with the release key)
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "No release key: no Play Store bundle."; exit 0; fi
          ./gradlew bundleRelease --no-daemon \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.enableMinifyInReleaseBuilds=true \
            -Pandroid.enableShrinkResourcesInReleaseBuilds=true
          cp app/build/outputs/bundle/release/app-release.aab ../dist/MySuccess-PlayStore.aab
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: aab
          path: dist/MySuccess-PlayStore.aab
          if-no-files-found: ignore
          retention-days: 30

      # Passed to the emulator check below; not a download for users (deleted after a day).
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/MySuccess.apk
          retention-days: 1

  # Installs the APK on an Android emulator, opens it and fails if it crashes.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # Android 14 x86_64 images run 64-bit ARM apps through built-in translation.
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r MySuccess.apk
            adb logcat -c
            adb shell monkey -p com.successprabu.aimobileapp -c android.intent.category.LAUNCHER 1
            sleep 40
            adb exec-out screencap -p > app-start.png
            adb logcat -d > logcat.txt
            if ! adb shell pidof com.successprabu.aimobileapp; then echo "::error::The app is not running 40 s after opening"; grep -A30 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            if grep -q "FATAL EXCEPTION" logcat.txt; then echo "::error::The app crashed"; grep -A30 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            echo "App started and is still running."

      - name: Keep the screenshot and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: |
            app-start.png
            logcat.txt
          retention-days: 7

